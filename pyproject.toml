[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "imdb-sentiment-analyzer"
version = "0.2.0"
description = "TF-IDF + linear-model sentiment classification of IMDb movie reviews"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "joblib>=1.3",
]

[project.optional-dependencies]
app = ["streamlit>=1.36", "plotly>=5.20"]
data = ["requests>=2.31", "tqdm>=4.66"]
notebook = ["matplotlib>=3.8", "seaborn>=0.13", "wordcloud>=1.9", "nltk>=3.8", "jupyter>=1.0"]
dev = ["pytest>=8.0", "nbstripout>=0.7"]

[project.scripts]
sentiment-train = "sentiment.train:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
